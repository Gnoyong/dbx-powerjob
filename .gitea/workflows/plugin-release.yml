name: Release DBX plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate

      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          manifest_version="$(node -p "require('./manifest.json').version")"

          if [[ "$tag_version" != "$package_version" || "$tag_version" != "$manifest_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($package_version) and manifest.json ($manifest_version)." >&2
            exit 1
          fi

      - name: Build release package
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run build
          node node_modules/@dbx-app/plugin-cli/bin/dbx-plugin.js package .

      - name: Publish rolling latest release
        run: node scripts/publish-gitea-release.mjs dist/*.dbxp dist/*.artifact.json
