name: Release DBX plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate

      - name: Verify release version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          $packageVersion = node -p "require('./package.json').version"
          $manifestVersion = node -p "require('./manifest.json').version"

          if ($tagVersion -ne $packageVersion -or $tagVersion -ne $manifestVersion) {
            throw "Tag $env:GITHUB_REF_NAME does not match package.json ($packageVersion) and manifest.json ($manifestVersion)."
          }

      - name: Build release package
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run build
          node node_modules/@dbx-app/plugin-cli/bin/dbx-plugin.js package .

      - name: Publish rolling latest release
        shell: pwsh
        run: |
          $assets = Get-ChildItem -LiteralPath dist -File |
            Where-Object { $_.Name -like '*.dbxp' -or $_.Name -like '*.artifact.json' } |
            ForEach-Object { $_.FullName }
          if (-not $assets) {
            throw "No Windows release assets were produced."
          }
          node scripts/publish-gitea-release.mjs @assets
