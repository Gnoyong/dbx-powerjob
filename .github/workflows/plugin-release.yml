name: Release DBX plugin

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing GitHub Release tag that receives the plugin assets
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify:
    name: Verify release version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release-tag }}

      - name: Check tag, package.json, and manifest.json agree
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release-tag }}
        run: |
          tag_version="${RELEASE_TAG#v}"
          package_version="$(node -p 'require("./package.json").version')"
          manifest_version="$(node -p 'require("./manifest.json").version')"
          if [ "$tag_version" != "$package_version" ] || [ "$tag_version" != "$manifest_version" ]; then
            echo "Tag $RELEASE_TAG does not match package.json ($package_version) and manifest.json ($manifest_version)." >&2
            exit 1
          fi
          echo "Releasing version $tag_version"

  release:
    name: Build and publish candidates
    needs: verify
    uses: t8y2/dbx/.github/workflows/plugin-release-reusable.yml@31ca3f773a02fabe7f23505cce93e7346c6394f8
    with:
      release-tag: ${{ github.event.release.tag_name || inputs.release-tag }}
      package-command: |
        package_manager="$(node -p 'require("./package.json").packageManager')"
        if ! command -v pnpm >/dev/null || [ "$(pnpm --version)" != "${package_manager#pnpm@}" ]; then
          npm install --global "$package_manager"
        fi
        pnpm install --frozen-lockfile
        pnpm typecheck
        pnpm run build
        dbx-plugin package .
      package-path: dist/*.dbxp
      metadata-path: dist/*.artifact.json
      plugin-cli-version: 0.1.9
      rust-toolchain: ""
      build-matrix: >-
        {"include":[{"runner":"ubuntu-24.04","target":"linux-x64"},{"runner":"ubuntu-24.04-arm","target":"linux-arm64"},{"runner":"windows-11-arm","target":"windows-arm64"},{"runner":"windows-2022","target":"windows-x64"},{"runner":"macos-15-intel","target":"darwin-x64"},{"runner":"macos-15","target":"darwin-arm64"}]}
